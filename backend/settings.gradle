pluginManagement {
    includeBuild 'build-logic'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'content-meta-migration'

include 'aibo-dependencies'
include 'aibo-framework:aibo-common'
include 'aibo-framework:aibo-spring-boot-starter-web'
include 'aibo-framework:aibo-spring-boot-starter-security'
include 'aibo-framework:aibo-spring-boot-starter-audit'
include 'aibo-framework:aibo-spring-boot-starter-redis'
include 'aibo-module-auth:aibo-module-auth-api'
include 'aibo-module-auth:aibo-module-auth-server'
